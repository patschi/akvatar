# Akvatar is a self-hosted web app that lets users update their profile photo.
# After login via OIDC, users can upload or import an image (Gravatar, URL,
# or webcam), crop it client-side, and the backend processes it for multiple
# configurable sizes and formats. After this, it pushes it to Authentik
# via API and optionally to LDAP Server. A scheduled cleanup job handles
# orphaned files and retention.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "akvatar"
version = "0.1"
description = "Self-hosted web application for users to update profile pictures in Authentik and optionally LDAP."
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.13"
dependencies = [
    "Flask==3.1.3",
    "Pillow==12.3.0",
    "authlib==1.8.0",
    "requests==2.34.2",
    "ldap3==2.9.1",
    "PyYAML==6.0.3",
    "gunicorn==26.2.0",
    "croniter==6.2.4",
    "cryptography==50.0.1",
    "sentry-sdk[flask]==2.68.1",
    "h2==4.4.1",
]

[tool.setuptools]
# Standalone app - no importable Python package to install; pip install only resolves deps.
packages = []
py-modules = []

[tool.setuptools.package-data]
"*" = []

# ---------------------------------------------------------------------------
# Ruff - linting and formatting
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernise syntax for the target Python version)
    "B",   # flake8-bugbear (likely bugs and design issues)
    "C4",  # flake8-comprehensions (prefer comprehensions over map/filter)
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long - handled by the formatter
    "UP015", # Checks for redundant open mode arguments.
]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Development dependencies - test tooling only.
#
# Declared as a PEP 735 dependency group so the container build (which runs
# `uv export --frozen --no-dev`) never pulls these into the runtime image.
# ---------------------------------------------------------------------------

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

# ---------------------------------------------------------------------------
# pytest - test discovery and default options
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "9.0"
# All tests live under tests/; nothing outside it is collected.
testpaths = ["tests"]
# -ra          : summarize every non-passing outcome at the end of the run
# --strict-markers / --strict-config : fail on unknown markers or ini keys
#                instead of silently ignoring a typo
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: spawns a subprocess (config validation) - noticeably slower than a unit test",
]

# ---------------------------------------------------------------------------
# coverage.py - measurement scope for the test suite
# ---------------------------------------------------------------------------

[tool.coverage.run]
# `include` (path/glob based) is used instead of `source`: coverage *imports*
# any `source` entry that is not a directory in order to resolve it as a package
# name, and importing app.py at plugin-init time would load src/config.py before
# tests/conftest.py has pointed CONFIG_PATH at the test configuration - which
# aborts the whole run with a FATAL.
# run_app.py is deliberately absent: importing it launches gunicorn.
include = [
    "src/*",
    "app.py",
    "run_cleanup.py",
    "run_sync_gravatar.py",
]
# Keep third-party modules out of the report: the include patterns above match
# on file name, so an installed dependency with a same-named module (e.g.
# flask/app.py) would otherwise be measured too.
omit = [
    "*/site-packages/*",
    "*/.venv/*",
    "tests/*",
]

[tool.coverage.report]
exclude_also = [
    # Entry-point guards are exercised by running the script, not by importing it.
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
